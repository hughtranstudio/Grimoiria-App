name: Mac app build

# core.yml runs on Ubuntu, which cannot see the SwiftUI app target at all.
# This job compiles the whole Mac app (App/) on macOS 26 with Xcode 26, so a
# change that breaks the app is caught on the pull request, not on Hugh's Mac.
on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "App/**"
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Build products outside the repository, as App/build.sh does: the app package depends on
      # the repository root as a package, so a .build folder inside it confuses the build.
      - run: echo "SCRATCH=$RUNNER_TEMP/grimoire-build" >> "$GITHUB_ENV"
      - name: Xcode
        run: |
          ls -d /Applications/Xcode_26*.app
          xcode-select -p
          swift --version
      - name: Compile the Mac app (every target, release, as build.sh does)
        run: swift build -c release --package-path App --scratch-path "$SCRATCH"
      - name: Show the compiler's own errors
        if: failure()
        run: |
          swift build -c release --package-path App --scratch-path "$SCRATCH" -v 2>&1 \
            | grep -v '^\s*$' | grep -iE 'error|fatal|crash|signal|Stack dump|frontend' | head -80
      - name: App rules tests (GrimoireAppKit)
        run: swift test -c release -Xswiftc -enable-testing --package-path App --scratch-path "$SCRATCH-test"
      - name: Core tests on macOS
        run: swift test
