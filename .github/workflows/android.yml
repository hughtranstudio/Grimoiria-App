name: Android capture app

on:
  push:
    paths:
      - "android/**"
      - "Sources/GrimoireCore/Resources/**"
      - "Tests/GrimoireCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "Sources/GrimoireCore/Resources/**"
      - "Tests/GrimoireCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (parser parity with Swift, sidecar, outbox)
        run: ./gradlew :core:test
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-capture-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/core/build/reports/tests/
