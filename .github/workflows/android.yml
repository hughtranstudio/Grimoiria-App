name: Android capture app

on:
  push:
    paths:
      - "android/**"
      - "Sources/GrimoireCore/Resources/**"
      - "Tests/GrimoireCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "Sources/GrimoireCore/Resources/**"
      - "Tests/GrimoireCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (parser parity with Swift, sidecar, outbox)
        run: ./gradlew :core:test
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      # Every push becomes a GitHub release, so Obtainium on the Pixel can offer it as a one-tap update.
      - name: Publish release for the phone
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "grimoire-capture-$v.apk"
          gh release create "capture-v$v" "grimoire-capture-$v.apk" \
            --title "Grimoire Capture $v" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}." \
            --target "$GITHUB_SHA" --latest
          # Keep the five newest capture builds.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("capture-v"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-capture-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/core/build/reports/tests/
